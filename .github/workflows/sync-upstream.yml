name: Sync upstream (pur1fying)

# 把原仓库 pur1fying/blue_archive_auto_script 的 master 自动合并进本 fork 的分支。
# 冲突时不做任何破坏性操作：放弃本次合并、保持分支原状，并让本次运行"失败"，
# 由 GitHub 自动发送失败邮件通知；详细冲突文件与解决命令写在运行摘要里。

on:
  schedule:
    - cron: "17 19 * * *" # 每天 03:17 (UTC+8)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

env:
  UPSTREAM_URL: https://github.com/pur1fying/blue_archive_auto_script.git
  UPSTREAM_BRANCH: master

jobs:
  sync:
    if: github.repository == 'koudaiai/blue_archive_auto_script'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - branch: master
          - branch: fix/cafe-invite-fuzzy-name
    steps:
      - name: Checkout ${{ matrix.branch }}
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.branch }}
          fetch-depth: 0

      - name: Merge upstream into ${{ matrix.branch }}
        id: merge
        shell: bash
        run: |
          set -uo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git remote add upstream "$UPSTREAM_URL" 2>/dev/null || git remote set-url upstream "$UPSTREAM_URL"
          if ! git fetch --no-tags upstream "$UPSTREAM_BRANCH"; then
            echo "status=fetch-failed" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git merge-base --is-ancestor FETCH_HEAD HEAD; then
            echo "已经是最新，无需合并"
            echo "status=up-to-date" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git merge --no-edit -m "chore: sync upstream pur1fying/blue_archive_auto_script" FETCH_HEAD; then
            if git push origin "HEAD:${{ matrix.branch }}"; then
              echo "status=merged" >> "$GITHUB_OUTPUT"
            else
              echo "status=push-failed" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi

          # 冲突：记录冲突文件后放弃本次合并，分支保持原状
          files=$(git diff --name-only --diff-filter=U | paste -sd ',' - | sed 's/,/, /g')
          git merge --abort || true
          echo "status=conflict" >> "$GITHUB_OUTPUT"
          echo "files=$files" >> "$GITHUB_OUTPUT"
          exit 0

      - name: 上游同步失败（本步骤失败即触发 GitHub 邮件通知）
        if: >-
          steps.merge.outputs.status == 'conflict' ||
          steps.merge.outputs.status == 'push-failed' ||
          steps.merge.outputs.status == 'fetch-failed'
        shell: bash
        env:
          BRANCH: ${{ matrix.branch }}
          STATUS: ${{ steps.merge.outputs.status }}
          FILES: ${{ steps.merge.outputs.files }}
        run: |
          set -uo pipefail
          case "$STATUS" in
            conflict)
              reason="与上游冲突，已放弃本次合并（分支未改动）"
              hint="冲突文件：${FILES}"
              ;;
            push-failed)
              reason="合并成功但推送失败"
              hint="检查 Settings → Actions → General → Workflow permissions 是否为 Read and write"
              ;;
            *)
              reason="拉取上游失败（网络或上游仓库异常）"
              hint="通常是临时网络问题，下次运行会自动重试"
              ;;
          esac

          {
            echo "### 上游同步失败：${BRANCH}"
            echo ""
            echo "- 原因：${reason}"
            echo "- ${hint}"
            echo ""
            if [ "$STATUS" = "conflict" ]; then
              echo "本机手动解决："
              echo '```bash'
              echo "git fetch https://github.com/pur1fying/blue_archive_auto_script.git master"
              echo "git checkout ${BRANCH}"
              echo "git merge FETCH_HEAD     # 解决冲突后 commit"
              echo "git push origin ${BRANCH}"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          echo "::error::[${BRANCH}] ${reason}。${hint}"
          # 故意失败：GitHub 会向触发者发送失败邮件，这就是唯一通知渠道
          exit 1
