name: Build BaasOnAndroid APK (arm64)

# 手动触发的手机版构建：把 pur1fy_dev 分支的 BaasOnAndroid 打包成 arm64 APK。
# 产物在本次运行的 Artifacts 里（BAAS_Android_arm64），下载后可直接 adb install。
#
# 说明：
# - 上游自带的 android_build.yml 有 `if: repository == 'pur1fying/...'` 守卫，在 fork 里不会执行，
#   这个文件是它的无守卫精简版（只构建 arm64，省一半时间）。
# - 源码固定取上游 pur1fy_dev（手机运行时 android_main.py / core/android/ 只在该分支）。
# - 构建很重：首次约 40~90 分钟，主要耗时在 python-for-android 编译 Qt6 / numpy / opencv。

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    env:
      JAVA_HOME: /opt/java/openjdk-17
    steps:
      - name: Checkout BAAS (test/dev-merge)
        uses: actions/checkout@v4
        with:
          repository: koudaiai/blue_archive_auto_script
          ref: test/dev-merge
          fetch-depth: 0
          path: blue_archive_auto_script

      - name: Setup Python 3.9
        uses: actions/setup-python@v6
        with:
          python-version: '3.9'

      - name: Setup build environment
        working-directory: ./blue_archive_auto_script
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ffmpeg libsm6 libxext6 libegl1 patchelf ant autoconf automake ccache \
            lbzip2 libffi-dev libltdl-dev libtool libssl-dev patch pkg-config \
            sudo unzip wget zip adb
          sudo rm -rf /var/lib/apt/lists/*
          python -m pip install --no-cache-dir --upgrade pip
          python -m pip install --no-cache-dir scikit-build-core
          python -m pip install --no-cache-dir -r deploy/android/requirements-build.txt

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'adopt'
          java-version: '17'

      # 锁屏 PIN 不入库：从仓库 Secret 注入到打包产物里
      - name: Inject unlock PIN
        working-directory: ./blue_archive_auto_script
        env:
          BAAS_PIN: ${{ secrets.BAAS_PIN }}
        run: |
          if [ -n "${BAAS_PIN}" ]; then
            mkdir -p config
            printf '{\n  "enabled": true,\n  "password": "%s"\n}\n' "${BAAS_PIN}" > config/android_power.json
            echo "config/android_power.json 已写入（PIN 长度 ${#BAAS_PIN}）"
          else
            echo "::warning::未设置 BAAS_PIN secret，解锁密码将为空，需要运行后手动写入配置"
          fi

      - name: Build APK (arm64-v8a)
        working-directory: ./blue_archive_auto_script
        run: |
          mkdir -p "${ANDROID_SDK_ROOT}/tools/"
          cp -r "${ANDROID_SDK_ROOT}/cmdline-tools/latest/"* "${ANDROID_SDK_ROOT}/tools/"
          python deploy/android/build.py all \
            --arch arm64-v8a \
            --android-sdk-path "${ANDROID_SDK_ROOT}" \
            --android-ndk-path "${ANDROID_NDK_LATEST_HOME}" \
            --min-api=24

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          path: ./blue_archive_auto_script/bin/*.apk
          name: BAAS_Android_arm64
          if-no-files-found: error
