name: Build BaasOnAndroid APK (arm64)

# 手动触发的手机版构建：把「本 fork 的自改分支」打包成 arm64 APK。
# 产物在本次运行的 Artifacts 里（BAAS_Android_arm64），下载后可直接 adb install。
#
# 说明：
# - 上游自带的 android_build.yml 有 `if: repository == 'pur1fying/...'` 守卫，在 fork 里不会执行，
#   这个文件是它的无守卫精简版（只构建 arm64，省一半时间）。
# - 源码固定取本仓库的 test/dev-merge（前台服务 / 界面填 PIN / 4 小时稳定性测试只在该分支）。
#   注意：千万不要改回 checkout 上游 pur1fy_dev，那样自改代码一个字节都不会进 APK。
# - workflow_dispatch 的 UI 只在默认分支列出 workflow，所以 master 上放了同一份文件；
#   两边都通过 source_branch 指定真正要打包的分支。
# - 构建很重：首次约 40~90 分钟，主要耗时在 python-for-android 编译 Qt6 / numpy / opencv。

on:
  workflow_dispatch:
    inputs:
      source_branch:
        description: '要打包的分支（默认 test/dev-merge，不要改成上游分支）'
        required: false
        default: 'test/dev-merge'

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    env:
      JAVA_HOME: /opt/java/openjdk-17
    steps:
      - name: Checkout BAAS source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_branch || github.ref_name }}
          fetch-depth: 0
          path: blue_archive_auto_script

      - name: Verify source revision
        working-directory: ./blue_archive_auto_script
        run: |
          echo "Requested branch: ${{ inputs.source_branch || github.ref_name }}"
          echo "Actual HEAD:"
          git log -1 --oneline
          # 选错分支（尤其选回上游 pur1fy_dev）时立刻失败，别浪费 90 分钟编译
          for f in android_main.py core/android/power.py core/android/foreground.py \
                   gui/components/expand/androidConfig.py \
                   deploy/android/src/main/java/org/baas/boa/BaasForegroundService.java; do
            if [ ! -f "$f" ]; then
              echo "::error::Missing $f - wrong branch, need test/dev-merge (self-modified Android code)"
              exit 1
            fi
          done
          echo "Android runtime sources verified."

      - name: Setup Python 3.9
        uses: actions/setup-python@v6
        with:
          python-version: '3.9'

      - name: Setup build environment
        working-directory: ./blue_archive_auto_script
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ffmpeg libsm6 libxext6 libegl1 patchelf ant autoconf automake ccache \
            lbzip2 libffi-dev libltdl-dev libtool libssl-dev patch pkg-config \
            sudo unzip wget zip adb
          sudo rm -rf /var/lib/apt/lists/*
          python -m pip install --no-cache-dir --upgrade pip
          python -m pip install --no-cache-dir scikit-build-core
          python -m pip install --no-cache-dir -r deploy/android/requirements-build.txt

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'adopt'
          java-version: '17'

      - name: Build APK (arm64-v8a)
        working-directory: ./blue_archive_auto_script
        run: |
          mkdir -p "${ANDROID_SDK_ROOT}/tools/"
          cp -r "${ANDROID_SDK_ROOT}/cmdline-tools/latest/"* "${ANDROID_SDK_ROOT}/tools/"
          python deploy/android/build.py all \
            --arch arm64-v8a \
            --android-sdk-path "${ANDROID_SDK_ROOT}" \
            --android-ndk-path "${ANDROID_NDK_LATEST_HOME}" \
            --min-api=24

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          path: ./blue_archive_auto_script/bin/*.apk
          name: BAAS_Android_arm64
          if-no-files-found: error
